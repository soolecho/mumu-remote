<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MuMu 远控</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:#0f1012; color:#e8e8e8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }

  /* 顶部状态条：大字 + 颜色，一眼看清 */
  #statusbar { flex:none; padding:12px 14px; background:#2a2a2e; border-bottom:1px solid #3a3a3e;
               display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; }
  #statusbar .dot { width:12px; height:12px; border-radius:50%; background:#888; flex:none; }
  #statusbar.s-ok      { background:#123a24; color:#7ff0a8; }
  #statusbar.s-ok .dot { background:#4ade80; }
  #statusbar.s-busy    { background:#3a3212; color:#f5d76e; }
  #statusbar.s-busy .dot{ background:#facc15; }
  #statusbar.s-err     { background:#3a1616; color:#ff9b9b; }
  #statusbar.s-err .dot{ background:#f87171; }
  #statusbar .spacer { flex:1; }
  #statusbar .mini { font-size:12px; font-weight:400; opacity:.75; padding:6px 10px;
                     border:1px solid currentColor; border-radius:6px; }

  /* 连接设置区：实例 + 口令 + 连接 全挤在一行，给画面腾高度 */
  #setup { flex:none; padding:8px 10px; background:#191a1d; border-bottom:1px solid #2a2a2e; }
  #setup .row { display:flex; gap:6px; align-items:center; }
  select,input,button { background:#2b2b30; color:#eee; border:1px solid #45454b; border-radius:9px;
                        padding:11px 8px; font-size:14px; }
  #instance { flex:1; min-width:0; }
  #token-row { flex:1.1; min-width:0; }
  #token { width:100%; }
  #connect { flex:none; width:72px; background:#2563eb; border-color:#2563eb; color:#fff;
             font-weight:700; font-size:15px; }
  #connect:active { background:#1d4ed8; }

  /* 画面区 */
  #stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center;
           overflow:hidden; background:#0a0a0c; min-height:120px; }
  #screen { max-width:100%; max-height:100%; object-fit:contain; touch-action:none; }
  #hint { position:absolute; text-align:center; padding:24px; color:#888; line-height:1.8; }
  #hint .big { font-size:42px; margin-bottom:10px; }
  #hint .lead { font-size:17px; color:#bbb; }
  #hint .sub { font-size:13px; }
  #hint.err .lead { color:#ff9b9b; }

  /* 自定义快捷键行：横向滚动，按钮保持可读宽度，不会被挤成细条 */
  #btnbar { flex:none; display:flex; gap:8px; padding:8px 10px; background:#191a1d;
            border-top:1px solid #2a2a2e; overflow-x:auto; overflow-y:hidden;
            -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  #btnbar::-webkit-scrollbar { display:none; }
  #btnbar button { flex:0 0 auto; min-width:76px; padding:12px 14px; font-size:14px; font-weight:600; }
  #btnbar button:active { background:#3b3b42; }
  #btnbar:empty { display:none; }

  /* 底部工具条 */
  #tools { flex:none; display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
           background:#141517; }
  #tools button { flex:1; padding:12px 4px; font-size:14px; }
  /* 常用按键条（返回/Esc/方向键等） */
  #keybar { flex:none; display:flex; gap:6px; padding:6px 10px; background:#202126;
            border-top:1px solid #2a2a2e; overflow-x:auto; scrollbar-width:none; }
  #keybar::-webkit-scrollbar { display:none; }
  #keybar button { flex:0 0 auto; min-width:52px; padding:10px 10px; font-size:13px; font-weight:600; }
  #keybar button:active { background:#3b3b42; }

  /* 网页键盘 */
  #kb { flex:none; display:none; flex-direction:column; gap:6px; padding:8px 10px; background:#1c1d20;
        border-top:1px solid #2a2a2e; max-height:56vh; overflow-y:auto; }
  #kb .kbtop { display:flex; gap:6px; }
  #kb .kbtop input { flex:1; min-width:0; }
  #kb .kbtop button { flex:none; }
  #kb-keys { display:flex; flex-direction:column; gap:6px; }
  #kb-keys .kr { display:flex; gap:6px; }
  #kb-keys .k { flex:1 1 0; min-width:0; padding:13px 0; font-size:15px; text-align:center; }
  #kb-keys .k.on { background:#2563eb; border-color:#2563eb; color:#fff; }
  #kb .tip { font-size:11px; color:#8b9096; text-align:center; }

  /* 自定义面板（覆盖式，半屏） */
  #editor { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
            align-items:flex-end; z-index:50; }
  #editor.show { display:flex; }
  #editor .panel { width:100%; max-height:82vh; background:#17181b; border-radius:14px 14px 0 0;
                   border-top:1px solid #34343a; display:flex; flex-direction:column; }
  #editor .head { display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid #2a2a2e;
                  font-size:16px; font-weight:700; }
  #editor .head .spacer { flex:1; }
  #editor .head button { padding:6px 12px; }
  #editor .tip { padding:10px 14px; font-size:12px; color:#9aa0a6; line-height:1.7; }
  #editor .tip code { background:#26272b; padding:1px 4px; border-radius:4px; color:#8ecdf7; }
  #ed-rows { overflow-y:auto; padding:0 14px; }
  #ed-rows .r { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  #ed-rows .r input.n { width:92px; flex:none; }
  #ed-rows .r input.a { flex:1; min-width:0; font-size:13px; }
  #ed-rows .r button { flex:none; padding:10px 12px; color:#ff9b9b; }
  #editor .foot { display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); }
  #editor .foot button { flex:1; padding:13px 4px; }
  #ed-save { background:#2563eb; border-color:#2563eb; color:#fff; font-weight:700; }
</style>
</head>
<body>
<div id="statusbar">
  <span class="dot"></span>
  <span id="status-text">未连接</span>
  <span class="spacer"></span>
  <button class="mini" id="btn-disconn" style="display:none">断开</button>
</div>

<div id="setup">
  <div class="row">
    <select id="instance"></select>
    <span id="token-row"><input id="token" type="text" placeholder="口令" autocomplete="off"></span>
    <button id="connect">连接</button>
  </div>
</div>

<div id="stage">
  <div id="hint">
    <div class="big">📱</div>
    <div class="lead">选择实例，填口令，点【连接】</div>
    <div class="sub">连上后这里会显示模拟器画面</div>
  </div>
  <img id="screen" style="display:none" alt="screen">
</div>

<div id="btnbar"><!-- 自定义快捷键，由 /api/instances 动态生成 --></div>

<div id="keybar">
  <button data-k="AndroidBack">返回</button>
  <button data-k="Escape">Esc</button>
  <button data-k="Tab">Tab</button>
  <button data-k="Enter">⏎</button>
  <button data-k="Backspace">⌫</button>
  <button data-k="AndroidHome">Home</button>
  <button data-k="AndroidAppSwitch">多任务</button>
  <button data-k="ArrowLeft">←</button>
  <button data-k="ArrowUp">↑</button>
  <button data-k="ArrowDown">↓</button>
  <button data-k="ArrowRight">→</button>
</div>

<div id="kb">
  <div class="kbtop">
    <input id="text" placeholder="中文/长文本：输入后点发送">
    <button id="send">发送</button>
  </div>
  <div id="kb-keys"></div>
  <div class="tip">Shift / Ctrl / Alt 点一次为按下，按完一个键自动弹起</div>
</div>

<div id="tools">
  <button id="btn-kb">⌨ 键盘</button>
  <button id="btn-edit">⚙ 自定义</button>
  <button id="btn-reconnect">⟳ 重连</button>
</div>

<div id="editor">
  <div class="panel">
    <div class="head">
      自定义快捷键
      <span class="spacer"></span>
      <button id="ed-close">关闭</button>
    </div>
    <div class="tip">
      每行一个按钮：按钮名 + 动作，动作之间用 <code>|</code> 分隔。<br>
      常用动作：<code>key:4</code> 返回 · <code>tap:500,145</code> 点坐标(0~1000) ·
      <code>swipe:500,900,500,300</code> 滑动 · <code>sleep:0.3</code> 等待 ·
      <code>shell:命令</code> 任意 adb 命令<br>
      保存后立即生效，不用重启服务。
    </div>
    <div id="ed-rows"></div>
    <div class="foot">
      <button id="ed-add">+ 添加按钮</button>
      <button id="ed-save">保存到被控端</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const screen=$('screen'), stage=$('stage'), statusEl=$('statusbar'), statusText=$('status-text');
const hint=$('hint'), setup=$('setup');
let ws=null, connected=false, authRequired=true, currentActions={};

// 渲染自定义快捷键按钮（横向滚动，按钮不会被挤扁）
function renderButtons(){
  const box=$('btnbar'); box.innerHTML='';
  Object.keys(currentActions).forEach(name=>{
    const b=document.createElement('button');
    b.textContent=name;
    b.onclick=()=>send({type:'action',name:name});
    box.appendChild(b);
  });
}

// ---- 自定义面板 ----
function addEditRow(name, steps){
  const r=document.createElement('div'); r.className='r';
  const ni=document.createElement('input'); ni.className='n'; ni.placeholder='按钮名'; ni.value=name||'';
  const ai=document.createElement('input'); ai.className='a'; ai.placeholder='动作，如 tap:500,145'; ai.value=steps||'';
  const del=document.createElement('button'); del.textContent='✕'; del.title='删除这个按钮';
  del.onclick=()=>r.remove();
  r.appendChild(ni); r.appendChild(ai); r.appendChild(del);
  $('ed-rows').appendChild(r);
  return r;
}

function openEditor(){
  const rows=$('ed-rows'); rows.innerHTML='';
  const names=Object.keys(currentActions);
  if(!names.length){ addEditRow('',''); }
  else names.forEach(n=>addEditRow(n, (currentActions[n]||[]).join(' | ')));
  $('editor').classList.add('show');
}

function collectEditor(){
  const out={};
  $('ed-rows').querySelectorAll('.r').forEach(r=>{
    const n=r.querySelector('.n').value.trim();
    const a=r.querySelector('.a').value.trim();
    if(!n) return;
    out[n]=a.split('|').map(s=>s.trim()).filter(Boolean);
  });
  return out;
}

async function saveEditor(){
  const actions=collectEditor();
  if(!Object.keys(actions).length){ alert('至少要留一个按钮'); return; }
  const btn=$('ed-save'); btn.disabled=true; btn.textContent='保存中…';
  try{
    const r=await fetch('/api/buttons',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:$('token').value.trim(), actions:actions})
    });
    const d=await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error||('HTTP '+r.status));
    currentActions=d.actions||actions;
    renderButtons();
    $('editor').classList.remove('show');
    setStatus('快捷键已保存 · '+Object.keys(currentActions).length+' 个','s-ok');
  }catch(e){
    alert('保存失败：'+e.message);
  }finally{
    btn.disabled=false; btn.textContent='保存到被控端';
  }
}

// 记住口令与上次选的实例，避免每次手输
try {
  const savedToken = localStorage.getItem('mumu_token');
  if (savedToken) $('token').value = savedToken;
} catch(e) {}

function setStatus(text, cls){
  statusText.textContent = text;
  statusEl.className = cls || '';
}
function showHint(lead, sub, isErr){
  hint.className = isErr ? 'err' : '';
  hint.innerHTML = '<div class="big">'+(isErr?'⚠️':'📱')+'</div>'+
                   '<div class="lead">'+lead+'</div>'+
                   '<div class="sub">'+(sub||'')+'</div>';
  hint.style.display='block';
  screen.style.display='none';
}

// 拉取实例列表（带明确失败提示）
fetch('/api/instances').then(r=>{
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}).then(d=>{
  authRequired = !!d.auth_required;
  // 服务端免口令时：隐藏口令行和提示，手机端一点就连
  if(!authRequired){
    $('token-row').style.display='none';   // 免口令：整个口令框藏起来，只剩实例+连接
  }
  // 按被控端配置动态生成快捷键按钮（名字和动作都在 config.json 里，网页里也能改）
  currentActions = (d.actions && typeof d.actions==='object') ? d.actions : {};
  (d.buttons||[]).forEach(n=>{ if(!(n in currentActions)) currentActions[n]=[]; });
  renderButtons();
  const sel=$('instance');
  sel.innerHTML='';
  const ports=Object.entries(d.instances);
  if(!ports.length){ showHint('没有可用的实例','请先在电脑端配置界面启用至少一个实例',true); return; }
  for (const [port,name] of ports) {
    const o=document.createElement('option'); o.value=port; o.textContent=name+' ('+port+')';
    sel.appendChild(o);
  }
  const savedPort=localStorage.getItem('mumu_port');
  if(savedPort && d.instances[savedPort]) sel.value=savedPort;
}).catch(e=>{
  showHint('无法连接到服务','请确认用 http://电脑IP:8000 打开本页，不要直接双击 index.html 文件',true);
  setStatus('加载失败','s-err');
});

function connect(){
  const port=$('instance').value;
  const token=$('token').value.trim();
  if (!port) { setStatus('请先选择实例','s-err'); return; }
  if (authRequired && !token) { setStatus('请先填写访问口令','s-err'); $('token').focus(); return; }
  try {
    localStorage.setItem('mumu_token', token);
    localStorage.setItem('mumu_port', port);
  } catch(e) {}

  if (ws) { try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
  connected=false;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  setStatus('正在连接 '+port+' …','s-busy');
  ws=new WebSocket(`${proto}//${location.host}/ws/${port}`);
  ws.binaryType='arraybuffer';

  ws.onopen=()=>{
    setStatus('验证口令中…','s-busy');
    ws.send(JSON.stringify({token:token}));
  };
  ws.onmessage=(e)=>{
    if (typeof e.data==='string') {
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if (m.type==='ready') {
        connected=true;
        screen.style.display='block'; hint.style.display='none';
        setup.style.display='none'; $('btn-disconn').style.display='';
        setStatus('已连接 · '+m.name+' ('+m.width+'×'+m.height+')','s-ok');
      } else if (m.type==='error') {
        setStatus('错误：'+m.msg,'s-err');
        showHint(m.msg,'检查口令是否与被控端一致（注意大小写）',true);
      }
      return;
    }
    const blob=new Blob([e.data],{type:'image/jpeg'});
    const url=URL.createObjectURL(blob);
    const old=screen.src;
    screen.src=url;
    if (old) URL.revokeObjectURL(old);
  };
  ws.onclose=()=>{
    connected=false;
    setup.style.display=''; $('btn-disconn').style.display='none';
    setStatus('已断开','s-err');
    showHint('连接已断开','点【重连】或检查电脑端服务是否还在运行',true);
  };
  ws.onerror=()=>{
    setStatus('连接失败','s-err');
    showHint('连接失败','确认电脑 IP 和端口 8000 正确，且服务正在运行',true);
  };
}

function disconnect(){
  if(ws){ try{ ws.close(); }catch(e){} ws=null; }
  connected=false;
  setup.style.display=''; $('btn-disconn').style.display='none';
  setStatus('未连接','');
  showHint('已断开连接','选择实例后可重新连接',false);
}

function send(obj){ if (connected && ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }

// ---- 网页键盘：直接发真实键码，等价于外接键盘 ----
// 为什么不用安卓软键盘：MuMu 的输入法窗口挂在 display 0（frame 高度还是 0），
// 我们的 App 在 display 2，所以软键盘永远弹不出来。这里自己画一套。
const KB_KEYS = { shift:false, ctrl:false, alt:false };
const KB_ROWS = [
  [['1','Digit1'],['2','Digit2'],['3','Digit3'],['4','Digit4'],['5','Digit5'],
   ['6','Digit6'],['7','Digit7'],['8','Digit8'],['9','Digit9'],['0','Digit0']],
  [['q','KeyQ'],['w','KeyW'],['e','KeyE'],['r','KeyR'],['t','KeyT'],['y','KeyY'],
   ['u','KeyU'],['i','KeyI'],['o','KeyO'],['p','KeyP']],
  [['a','KeyA'],['s','KeyS'],['d','KeyD'],['f','KeyF'],['g','KeyG'],['h','KeyH'],
   ['j','KeyJ'],['k','KeyK'],['l','KeyL']],
  [['⇧','SHIFT',1.3],['z','KeyZ'],['x','KeyX'],['c','KeyC'],['v','KeyV'],['b','KeyB'],
   ['n','KeyN'],['m','KeyM'],['⌫','Backspace',1.3]],
  [['Ctrl','CTRL',1.2],['Alt','ALT',1.2],['空格','Space',3],['⏎','Enter',1.3],['Esc','Escape',1.2]],
];

function buildKeyboard(){
  const box=$('kb-keys');
  if (box.childElementCount) return;          // 只建一次
  KB_ROWS.forEach(row=>{
    const r=document.createElement('div'); r.className='kr';
    row.forEach(([label,code,grow])=>{
      const b=document.createElement('button');
      b.className='k'; b.textContent=label; b.dataset.code=code;
      if (grow) b.style.flexGrow=String(grow);
      b.onclick=()=>pressKey(b, code);
      r.appendChild(b);
    });
    box.appendChild(r);
  });
}

function resetMods(){
  KB_KEYS.shift=KB_KEYS.ctrl=KB_KEYS.alt=false;
  document.querySelectorAll('#kb-keys .k.on').forEach(el=>el.classList.remove('on'));
}

function pressKey(btn, code){
  if (code==='SHIFT'||code==='CTRL'||code==='ALT'){
    const on = !KB_KEYS[code.toLowerCase()];
    KB_KEYS[code.toLowerCase()] = on;
    btn.classList.toggle('on', on);
    return;
  }
  if (!connected){ setStatus('还没连接','s-err'); return; }
  let key='';
  if (code.startsWith('Key')){
    key = KB_KEYS.shift ? code.slice(3) : code.slice(3).toLowerCase();
  } else if (code.startsWith('Digit')){
    key = code.slice(5);
  } else if (code==='Space'){
    key = ' ';
  }
  send({type:'keycode', code:code, key:key,
        ctrl:KB_KEYS.ctrl, shift:KB_KEYS.shift, alt:KB_KEYS.alt, meta:false});
  resetMods();   // 修饰键按一次就弹起
}

// 常用按键条（返回/Esc/Tab/方向键…）
document.querySelectorAll('#keybar button').forEach(b=>{
  b.onclick=()=>{
    if (!connected){ setStatus('还没连接','s-err'); return; }
    send({type:'keycode', code:b.dataset.k, key:'',
          ctrl:false, shift:false, alt:false, meta:false});
  };
});

// ---- 电脑键盘映射：连上后用物理键盘直接操作被控端 ----
// 只让浏览器自己处理这些键，避免把 F5 刷新 / Ctrl+W 关页 抢走
function browserOwnsKey(e){
  if (e.ctrlKey || e.metaKey) {
    return ['KeyR','KeyW','KeyT','KeyN','KeyI','KeyJ','KeyL','KeyP','KeyS',
            'KeyD','KeyF','KeyG','KeyH','KeyO','KeyU','KeyA'].includes(e.code)
            && !e.shiftKey;   // Ctrl+A 让给被控端（全选很常用）
  }
  return e.code==='F5' || e.code==='F11' || e.code==='F12';
}

document.addEventListener('keydown', e=>{
  if (!connected || !e.code) return;
  const el=e.target||{};
  const tag=(el.tagName||'').toLowerCase();
  // 在输入框里打字时不劫持（口令框、文字发送框）
  if (tag==='input' || tag==='textarea' || tag==='select' || el.isContentEditable) return;
  if (browserOwnsKey(e)) return;
  send({type:'keycode', code:e.code, key:e.key,
        ctrl:e.ctrlKey, shift:e.shiftKey, alt:e.altKey, meta:e.metaKey});
  e.preventDefault();
}, false);

// 坐标换算：画面显示区域 -> 归一化 0-1000
function norm(clientX, clientY){
  const r=screen.getBoundingClientRect();
  let x=(clientX-r.left)/r.width*1000;
  let y=(clientY-r.top)/r.height*1000;
  return [Math.max(0,Math.min(1000,x)), Math.max(0,Math.min(1000,y))];
}

let startPt=null, moved=false;
screen.addEventListener('touchstart',e=>{
  e.preventDefault();
  if (e.touches.length!==1) { startPt=null; return; }
  const t=e.touches[0]; startPt=norm(t.clientX,t.clientY); moved=false;
},{passive:false});
screen.addEventListener('touchmove',e=>{
  e.preventDefault();
  if (!startPt || e.touches.length!==1) return;
  const t=e.touches[0]; const [x,y]=norm(t.clientX,t.clientY);
  if (Math.abs(x-startPt[0])>8 || Math.abs(y-startPt[1])>8) moved=true;
  send({type:'swipe',x1:startPt[0],y1:startPt[1],x2:x,y2:y,duration:200});
  startPt=[x,y];
},{passive:false});
screen.addEventListener('touchend',e=>{
  e.preventDefault();
  if (startPt && !moved) send({type:'tap',x:startPt[0],y:startPt[1]});
  startPt=null;
},{passive:false});

let mdown=false;
screen.addEventListener('mousedown',e=>{ mdown=true; startPt=norm(e.clientX,e.clientY); moved=false; });
screen.addEventListener('mousemove',e=>{
  if(!mdown||!startPt) return;
  const [x,y]=norm(e.clientX,e.clientY); moved=true;
  send({type:'swipe',x1:startPt[0],y1:startPt[1],x2:x,y2:y,duration:200}); startPt=[x,y];
});
screen.addEventListener('mouseup',()=>{ if(startPt&&!moved) send({type:'tap',x:startPt[0],y:startPt[1]}); mdown=false; });

// 鼠标滚轮 -> 远端滚动（手机端没有滚轮，但也兼容触控板）
screen.addEventListener('wheel', e=>{
  if(!connected) return;
  e.preventDefault();
  const dir = e.deltaY > 0 ? 1 : -1;          // 向下滚 = 内容上移 = 手指往上滑
  const span = Math.min(260, Math.max(80, Math.abs(e.deltaY) * 1.2));
  send({type:'swipe', x1:500, y1:500 + dir*span/2, x2:500, y2:500 - dir*span/2, duration:130});
}, {passive:false});

$('connect').onclick=connect;
$('btn-reconnect').onclick=connect;
$('btn-disconn').onclick=disconnect;
$('btn-kb').onclick=()=>{
  const k=$('kb');
  const show = k.style.display==='none' || !k.style.display;
  k.style.display = show ? 'flex' : 'none';
  if (show) buildKeyboard();
};
$('btn-edit').onclick=openEditor;
$('ed-close').onclick=()=>$('editor').classList.remove('show');
$('ed-add').onclick=()=>addEditRow('','');
$('ed-save').onclick=saveEditor;
$('editor').onclick=e=>{ if(e.target.id==='editor') $('editor').classList.remove('show'); };
$('send').onclick=()=>{ const v=$('text').value; if(v){ send({type:'text',value:v}); $('text').value=''; } };
$('token').addEventListener('keydown',e=>{ if(e.key==='Enter') connect(); });
</script>
